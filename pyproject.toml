[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "firefly-iii-mcp"
version = "2.0.0"
description = "Firefly III API + MCP Server + A2A Agent — personal finance manager"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0,<3.0.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@example.invalid"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0,<3.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0",]
all = [ "agent-utilities[mcp,agent-runtime,logfire]>=2.0.0,<3.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
firefly-iii-mcp = "firefly_iii_mcp.mcp_server:mcp_server"
firefly-iii-agent = "firefly_iii_mcp.agent_server:agent_server"

# Fleet contribution (CONCEPT:OS-5.52): advertise this package's skills and
# system-prompt blueprints so agent-utilities' skill-installer and KG prompt
# library discover them without importing this package's agent code.
[project.entry-points."agent_utilities.skill_providers"]
firefly-iii-mcp = "firefly_iii_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
firefly-iii-mcp = "firefly_iii_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
firefly-iii-mcp = "firefly_iii_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
firefly-iii-mcp = "firefly_iii_mcp.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
firefly_iii_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "specs/*.yaml", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]
